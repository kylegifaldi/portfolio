<style>
  body {
    cursor: none; /* Hide the default cursor */
    margin: 0;
    overflow: hidden;
  }
  
  #custom-cursor {
    position: fixed;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: screen;
    will-change: transform;
    transform: translate(-50%, -50%);
  }
  
  #cursor-outer {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 2px solid rgba(120, 220, 255, 0.7);
    border-radius: 50%;
    box-sizing: border-box;
    animation: pulse 2s infinite;
    transition: transform 0.1s ease-out, opacity 0.3s ease;
  }
  
  #cursor-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background-color: rgba(220, 240, 255, 1);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(100, 200, 255, 0.8);
  }
  
  #cursor-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 2px;
    background-color: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  
  /* Crosshair lines */
  .cursor-line {
    position: absolute;
    background-color: rgba(100, 200, 255, 0.6);
    transition: all 0.2s ease;
  }
  
  .cursor-line-h {
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    transform: translateY(-50%);
  }
  
  .cursor-line-v {
    top: 0;
    left: 50%;
    width: 1px;
    height: 100%;
    transform: translateX(-50%);
  }
  
  /* Triangular indicators */
  .cursor-tri {
    position: absolute;
    width: 0;
    height: 0;
    border-style: solid;
    opacity: 0.7;
    transition: all 0.2s ease;
  }
  
  .cursor-tri-top {
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 0 4px 6px 4px;
    border-color: transparent transparent rgba(100, 220, 255, 0.8) transparent;
  }
  
  .cursor-tri-right {
    top: 50%;
    right: -8px;
    transform: translateY(-50%);
    border-width: 4px 0 4px 6px;
    border-color: transparent transparent transparent rgba(100, 220, 255, 0.8);
  }
  
  .cursor-tri-bottom {
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 4px 0 4px;
    border-color: rgba(100, 220, 255, 0.8) transparent transparent transparent;
  }
  
  .cursor-tri-left {
    top: 50%;
    left: -8px;
    transform: translateY(-50%);
    border-width: 4px 6px 4px 0;
    border-color: transparent rgba(100, 220, 255, 0.8) transparent transparent;
  }
  
  /* Hover animation */
  @keyframes pulse {
    0% {
      opacity: 0.7;
      transform: scale(1);
    }
    50% {
      opacity: 0.9;
      transform: scale(1.1);
    }
    100% {
      opacity: 0.7;
      transform: scale(1);
    }
  }
  
  /* Hover state */
  body.cursor-hover #cursor-outer {
    border-color: rgba(255, 200, 100, 0.9);
    transform: scale(1.3);
  }
  
  body.cursor-hover .cursor-line {
    background-color: rgba(255, 200, 100, 0.8);
  }
  
  body.cursor-hover .cursor-tri-top {
    border-color: transparent transparent rgba(255, 200, 100, 0.9) transparent;
  }
  
  body.cursor-hover .cursor-tri-right {
    border-color: transparent transparent transparent rgba(255, 200, 100, 0.9);
  }
  
  body.cursor-hover .cursor-tri-bottom {
    border-color: rgba(255, 200, 100, 0.9) transparent transparent transparent;
  }
  
  body.cursor-hover .cursor-tri-left {
    border-color: transparent rgba(255, 200, 100, 0.9) transparent transparent;
  }
  
  body.cursor-hover #cursor-inner {
    background-color: rgba(255, 220, 100, 1);
    box-shadow: 0 0 10px rgba(255, 200, 100, 0.8);
  }
  #side-navigation {
    position: fixed;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none; /* Let clicks pass through the container */
  }
  
  .nav-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .scroll-hint {
    color: rgba(255, 255, 255, 0.7);
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 15px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
    text-align: center;
    font-family: monospace;
  }
  
  .scroll-hint.visible {
    opacity: 1;
    transform: translateY(0);
  }
  
  .nav-dots {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  
  .nav-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.5);
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: all 0.3s ease;
    pointer-events: auto; /* Make dots clickable */
  }
  
  .nav-dot:hover {
    transform: scale(1.2);
    border-color: rgba(255, 255, 255, 0.8);
  }
  
  .nav-dot.active {
    width: 14px;
    height: 14px;
    background-color: rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }
  
  /* Custom colors for each center */
  .nav-dot[data-index="0"] {
    border-color: rgba(0, 255, 255, 0.5);
  }
  .nav-dot[data-index="0"]:hover, .nav-dot[data-index="0"].active {
    background-color: rgba(0, 255, 255, 0.8);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
  }
  
  .nav-dot[data-index="1"] {
    border-color: rgba(102, 255, 102, 0.5);
  }
  .nav-dot[data-index="1"]:hover, .nav-dot[data-index="1"].active {
    background-color: rgba(102, 255, 102, 0.8);
    box-shadow: 0 0 10px rgba(102, 255, 102, 0.5);
  }
  
  .nav-dot[data-index="2"] {
    border-color: rgba(255, 136, 51, 0.5);
  }
  .nav-dot[data-index="2"]:hover, .nav-dot[data-index="2"].active {
    background-color: rgba(255, 136, 51, 0.8);
    box-shadow: 0 0 10px rgba(255, 136, 51, 0.5);
  }
  
  .dot-label {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    font-family: monospace;
    letter-spacing: 1px;
  }
  
  .nav-dot:hover .dot-label, .nav-dot.active .dot-label {
    opacity: 1;
    transform: translateY(-50%) translateX(-5px);
  }
  
  /* Add visual connecting line */
  .nav-dots::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0),
      rgba(255, 255, 255, 0.3),
      rgba(255, 255, 255, 0)
    );
    z-index: -1;
    transform: translateX(-50%);
    margin-top: -5px;
    margin-bottom: -5px;
  }
  #info-panel {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    max-width: 300px;
    z-index: 1000;
    display: none;
  }
  
  #info-panel.hidden {
    display: none;
  }
  
  #info-panel h2 {
    margin: 0 0 10px;
    font-size: 18px;
  }
  
  #info-panel p {
    margin: 0 0 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  
  #info-panel a {
    color: #00aaff;
    text-decoration: none;
    font-weight: bold;
  }
  
  #info-panel a:hover {
    text-decoration: underline;
  }

  .project-info-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: opacity 0.3s ease;
}

.project-info-panel.hidden {
    opacity: 0;
    pointer-events: none;
}

.panel-content {
    width: 80%;
    max-width: 1000px;
    height: 80%;
    max-height: 800px;
    background-color: rgba(20, 20, 30, 0.95);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 120, 255, 0.2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(80, 120, 255, 0.3);
    animation: panelAppear 0.3s ease-out;
}

@keyframes panelAppear {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: linear-gradient(to right, #1a1a2e, #16213e);
    border-bottom: 1px solid rgba(80, 120, 255, 0.3);
}

.project-title {
    color: #fff;
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    font-family: 'Space Mono', monospace;
}

.close-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background-color 0.2s;
}

.close-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

.panel-body {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: 25px;
    color: #e0e0e0;
}

.project-media {
    grid-column: 1;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.project-media video,
.project-media img {
    width: 100%;
    height: auto;
    object-fit: cover;
}

.project-description,
.project-tech-stack,
.project-links {
    grid-column: 2;
}

.project-description {
    line-height: 1.6;
    margin-bottom: 20px;
    font-size: 16px;
}

.project-tech-stack h3 {
    font-size: 18px;
    color: #88ccff;
    margin-bottom: 10px;
}

.project-tech-stack ul {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0;
    list-style: none;
}

.project-tech-stack li {
    background-color: rgba(60, 100, 170, 0.3);
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 14px;
    border: 1px solid rgba(100, 150, 240, 0.3);
}

.project-links {
    display: flex;
    gap: 15px;
    margin-top: 25px;
}

.project-links a {
    padding: 10px 20px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.2s;
    text-align: center;
    font-family: 'Space Mono', monospace;
}

.live-link {
    background-color: #0066cc;
    color: white;
}

.live-link:hover {
    background-color: #0077ee;
    box-shadow: 0 0 15px rgba(0, 120, 255, 0.4);
}

.repo-link {
    background-color: rgba(50, 50, 60, 0.6);
    color: #ccccff;
    border: 1px solid rgba(100, 120, 200, 0.4);
}

.repo-link:hover {
    background-color: rgba(60, 60, 80, 0.8);
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    .panel-body {
        grid-template-columns: 1fr;
    }
    
    .project-media,
    .project-description,
    .project-tech-stack,
    .project-links {
        grid-column: 1;
    }
}
